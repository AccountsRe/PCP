  .empty{text-align:center; padding:46px 20px; color:var(--soft)}
  .empty svg{width:38px;height:38px; opacity:.4; margin-bottom:12px}
  .empty .es{color:var(--faint); margin-top:3px}

  table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
  table.tbl th{ text-align:left; font-size:11px; font-weight:700; color:var(--soft); text-transform:uppercase; letter-spacing:.03em; padding:12px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
  table.tbl td{ padding:11px 12px; border-bottom:1px solid var(--line-2); vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl .name{font-weight:700}
  table.tbl input{width:66px; padding:7px 9px; font-size:13px; text-align:center}
  .rem-ok{color:var(--ok); font-weight:700} .rem-low{color:var(--danger); font-weight:700}
  .tblwrap{overflow-x:auto}
  .default-allow{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-bottom:6px}
  .default-allow .field{margin:0}
  .default-allow input{width:90px}

  .note{font-size:12px; color:var(--soft); background:var(--line-2); padding:10px 13px; border-radius:11px; margin-top:22px; line-height:1.6; display:flex; gap:8px}
  .note svg{width:15px;height:15px;flex:none;margin-top:2px}
  .note .es{color:var(--faint); margin-top:4px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 20px; border-radius:12px; font-size:13.5px; font-weight:600; opacity:0; transition:.28s; pointer-events:none; z-index:50; box-shadow:0 8px 30px rgba(0,0,0,.2); text-align:center; line-height:1.3}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:600px){ .grid2{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr} .balwrap{grid-template-columns:1fr} .req{flex-wrap:wrap}
    .wrap{padding:16px 12px 70px}
    .topbar{flex-wrap:wrap; gap:10px}
    .brand h1{font-size:17px}
    .who{width:100%; justify-content:flex-end; flex-wrap:wrap; gap:8px}
    .who b{max-width:none}
    .subnav{max-width:none; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch}
    .subnav button{flex:0 0 auto; min-width:86px}
    .stat .n{font-size:22px}
    .list-head{flex-wrap:wrap} .headbtns{width:100%}
    .filters select{flex:1 1 45%; min-width:0}
  }
</style>

function workHours(day){ const t=k=>{ const p=day.find(x=>x.kind===k); return p?new Date(p.punched_at).getTime():null; };
  const mi=t('morning_in'),lo=t('lunch_out'),li=t('lunch_in'),oo=t('off_out'); let ms=0;
  if(mi&&lo&&li&&oo){ ms=(lo-mi)+(oo-li); } else if(mi&&oo&&!lo&&!li){ ms=oo-mi; } else { if(mi&&lo) ms+=lo-mi; if(li&&oo) ms+=oo-li; }
  return ms>0?ms/3600000:0; }
function canPunchNames(){ return Object.keys(state.employees).filter(n=>state.employees[n] && state.employees[n].can_punch && state.employees[n].active!==false).sort((a,b)=>a.localeCompare(b)); }

function blslash(en, esT){ return state.role==='admin' ? en : `${en} / ${esT}`; }

function val(id){ const el=document.getElementById(id); return el?el.value:''; }

function fmtNum(n){ n=+n; return Number.isInteger(n)?n:n.toFixed(2).replace(/0$/,''); }
function fmtH(n){ return Math.round(+n||0); }
function dget(k){ return (state.dates && state.dates[k]) ? state.dates[k] : today(); }
function dayHintHTML(){
  const d=state.dur;
  if(d==='hourly') return `${bl('Counts as the hours you enter','Cuenta las horas ingresadas')} · ${bl('starts as Pending','queda Pendiente')}`;
  if(d==='half') return `${fmtNum(hpd()/2)}h (half day) · ${bl('starts as Pending','queda Pendiente')}`;
  const se=document.getElementById('rStart'), ee=document.getElementById('rEnd');
  const s=(se&&se.value)||dget('start'), e=(ee&&ee.value)||dget('end');
  const bd=(s&&e)?businessDays(s,e):null;
  return `${bd!=null?`<b>${bd} × ${fmtNum(hpd())}h = ${fmtNum(bd*hpd())}h</b> (weekends excluded) · `:''}${bl('starts as Pending','queda Pendiente')}`;
}
function updateDayHint(){ const el=document.getElementById('dayHint'); if(el) el.innerHTML=dayHintHTML(); }
function reqHours(r){
  if(!r) return 0;
  if(r.dur==='hourly') return Math.round(+r.hours||0);
  if(r.dur==='half') return Math.round(hpd()/2);
  const bd=businessDays(r.start, r.end||r.start); return Math.round(bd*hpd());
}
function daysBetween(s,e){ if(!s||!e) return 1; const d=Math.round((new Date(e)-new Date(s))/864e5)+1; return d>0?d:1; }
function businessDays(s,e){ if(!s||!e) return 0; let a=new Date(s+'T00:00:00'), b=new Date(e+'T00:00:00'); if(b<a) return 0; let n=0; const cur=new Date(a); while(cur<=b){ const wd=cur.getDay(); if(wd!==0 && wd!==6) n++; cur.setDate(cur.getDate()+1);} return n; }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ if(!d) return ''; const x=new Date(d+'T00:00:00'); return `${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; }
function fmtDT(v){ const x=new Date(v); let h=x.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()} ${h}:${String(x.getMinutes()).padStart(2,'0')} ${ap}`; }
function fmt12(hhmm){ if(!hhmm) return ''; const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'PM':'AM'; const hh=h%12||12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function addHours(hhmm,hrs){ if(!hhmm) return ''; let [h,m]=hhmm.split(':').map(Number); let tot=h*60+m + Math.round(hrs*60); tot=((tot%1440)+1440)%1440; const H=Math.floor(tot/60), M=tot%60; return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`; }
function today(){ return new Date().toISOString().slice(0,10); }
function hpd(){ return +(state.settings.hours_per_day)||8; }
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }

function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }

/* ============ data ============ */
function mapRow(r){
  let cat=r.type, dur=r.duration||'full';
  if(r.type==='half'){ cat='pto'; dur='half'; }        // resilience for un-migrated rows
  return { id:r.id, name:r.name, cat, dur, detail:(r.detail||cat), start:r.start_date, end:r.end_date, days:+r.days,
           startTime:r.start_time, hours:(r.hours!=null?+r.hours:null),
           reason:r.reason, by:r.submitted_by, status:r.status||'pending',
           reviewedBy:r.reviewed_by, reviewedAt:r.reviewed_at, editedBy:r.edited_by, editedAt:r.edited_at, createdAt:r.created_at,
           mgr:(r.manager_confirmed===true?true:(r.manager_confirmed===false?false:null)) };
}
async function loadRequests(){
  if(!db) return;
  const { data, error } = await db.from('requests').select('*').order('created_at',{ascending:false});
  if(error){ console.error(error); toast('Load failed · Error al cargar'); } else state.requests=(data||[]).map(mapRow);
  render();
}
async function loadSettings(){ if(!db) return; const { data } = await db.from('settings').select('*'); (data||[]).forEach(s=>{ state.settings[s.key]=s.value; }); }
async function loadEmployees(){ if(!db) return; const { data } = await db.from('employees').select('*'); const m={}; (data||[]).forEach(e=>{ m[e.name]={ pto_allowance:e.pto_allowance, sick_allowance:e.sick_allowance, can_punch:!!e.can_punch, active:(e.active!==false) }; }); state.employees=m; }
async function loadPunches(){ if(!db) return; const { data } = await db.from('punches').select('*').order('punched_at',{ascending:false}).limit(1000); state.punches=data||[]; render(); }
async function loadPunchNotes(){ if(!db) return; const { data } = await db.from('punch_notes').select('*').order('created_at',{ascending:false}).limit(1000); state.punchNotes=data||[]; }
async function loadLocations(){ if(!db) return; const { data } = await db.from('locations').select('*').order('name'); state.locations=data||[]; }
async function loadEmpLocs(){ if(!db) return; const { data } = await db.from('employee_locations').select('*'); const m={}; (data||[]).forEach(r=>{ (m[r.name]=m[r.name]||[]).push(r.location_id); }); state.empLocs=m; }
function allowedLocationsFor(name){ const ids=state.empLocs[name]; if(ids && ids.length) return state.locations.filter(l=>ids.includes(l.id)); return state.locations.slice(); }
function notesFor(name,date){ return state.punchNotes.filter(n=>n.name===name && n.work_date===date); }
async function loadAuth(){ if(!db || state.role!=='admin') return; const { data } = await db.from('employee_auth').select('*'); const m={}; (data||[]).forEach(a=>{ m[a.name]=a.login_code||''; }); state.codes=m; }
async function loadAudit(){ if(!db || state.role!=='admin') return; const { data } = await db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200); state.audit=data||[]; }
async function logAudit(action, detail){ try{ await db.from('audit_log').insert({ action, detail, actor:state.user }); }catch(e){} }
function subscribeRealtime(){
  if(!db || channel) return;
  channel = db.channel('pto-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'requests'}, ()=>loadRequests())
    .on('postgres_changes',{event:'*',schema:'public',table:'employees'}, ()=>loadEmployees().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},  ()=>loadSettings().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'punches'},   ()=>loadPunches())
    .on('postgres_changes',{event:'*',schema:'public',table:'punch_notes'},()=>loadPunchNotes().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'locations'},()=>loadLocations().then(render))
    .on('postgres_changes',{event:'*',schema:'public',table:'employee_locations'},()=>loadEmpLocs().then(render))
    .subscribe();
}

  if(error){ console.error(error); return setErr('Login failed, try again.','Error, inténtalo de nuevo.'); }
  if(!data){ return setErr('Code not recognized — check with your admin.','Código no reconocido — consulta con tu administrador.'); }
  ssSet('pto_emp', data); state.role='employee'; state.user=data; state.view='requests'; enterDash();
}

  const email=val('admId').trim(), pw=val('admPw');
  if(!email||!pw) return setErr('Enter email and password.','Ingresa correo y contraseña.');
  const { data, error } = await db.auth.signInWithPassword({ email, password: pw });

/* ---- auto logout after inactivity ---- */
const IDLE_MS = 5*60*1000;      // 5 minutes of no activity
const IDLE_WARN_MS = 30*1000;   // warn 30s before
let _idleT=null, _idleWarnT=null;
function resetIdleTimer(){
  if(!state.user) return;            // only when logged in
  clearTimeout(_idleT); clearTimeout(_idleWarnT);
  _idleWarnT=setTimeout(()=>{ if(state.user) toast('You will be logged out soon (inactive)<span class="b-es">Se cerrará la sesión por inactividad</span>'); }, IDLE_MS-IDLE_WARN_MS);
  _idleT=setTimeout(()=>{ if(state.user){ toast('Logged out — inactive 5 min<span class="b-es">Sesión cerrada por inactividad</span>'); logout(); } }, IDLE_MS);
}
function stopIdleTimer(){ clearTimeout(_idleT); clearTimeout(_idleWarnT); }
['click','keydown','touchstart','scroll','mousemove','visibilitychange'].forEach(ev=>{
  window.addEventListener(ev, ()=>{ if(document.visibilityState!=='hidden' && state.user) resetIdleTimer(); }, {passive:true});
});

/* ============ actions ============ */
async function submitReq(){
  if(state.busy) return;
  const name=val('rName').trim(), detail=state.detail, dur=state.dur, start=val('rStart');
  let cat=state.cat;
  if(!name) return toast('Enter a name<span class="b-es">Ingresa un nombre</span>');
  if(!start) return toast('Pick a start date<span class="b-es">Elige la fecha de inicio</span>');
  if(start < `${curYear()}-01-01`) return toast('Date must be within this year<span class="b-es">La fecha debe ser de este año</span>');
  let end=start, days=0, startTime=null, hours=null;
  if(dur==='full'){
    end=val('rEnd'); if(!end) return toast('Pick an end date<span class="b-es">Elige la fecha de fin</span>');
    days=businessDays(start,end);
    if(days<=0) return toast('That range is all weekend<span class="b-es">Ese rango es solo fin de semana</span>');
  } else if(dur==='half'){
    startTime=val('rTime'); if(!startTime) return toast('Pick a start time<span class="b-es">Elige la hora de inicio</span>');
    days=0.5;
  } else { // hourly
    startTime=val('rTime'); hours=parseInt(val('rHours'),10);
    if(!startTime) return toast('Pick a start time<span class="b-es">Elige la hora de inicio</span>');
    if(!hours || hours<=0) return toast('Enter hours (whole)<span class="b-es">Ingresa las horas (enteras)</span>');
    days = Math.round((hours/hpd())*100)/100;
  }
  // Reason is required
  const reason=(state.rReason||'').trim();
  if(!reason) return toast('Reason is required<span class="b-es">El motivo es obligatorio</span>');
  // Balance check for PTO/Sick — if short, offer to submit as Unpaid
  let converted=false;
  if(cat==='pto' || cat==='sick'){
    const reqH = Math.round(days*hpd());
    const remaining = allowanceFor(name,cat) - usageFor(name,cat,'approved') - usageFor(name,cat,'pending');
    if(reqH > remaining){
      const kindL = cat==='pto'?'PTO':'Sick';
      const ok = confirm(`Not enough ${kindL} balance — ${fmtH(remaining)}h left, ${reqH}h requested.\n\nSubmit this as UNPAID instead?\n\n`+
        `Saldo insuficiente de ${kindL} — quedan ${fmtH(remaining)}h, solicitas ${reqH}h.\n¿Enviar como SIN GOCE (Unpaid)?`);
      if(!ok) return;
      cat='unpaid'; converted=true;
    }
  }
  if(cat==='unpaid' && !converted){
    const ptoLeft=allowanceFor(name,'pto')-usageFor(name,'pto','approved');
    const sickLeft=allowanceFor(name,'sick')-usageFor(name,'sick','approved');
    if(ptoLeft>0 || sickLeft>0){
      const msg=`Heads up — ${name} still has balance left:\n`+
        (ptoLeft>0?`  • PTO: ${fmtH(ptoLeft)}h\n`:'')+
        (sickLeft>0?`  • Sick: ${fmtH(sickLeft)}h\n`:'')+
        `\nUnpaid does not use any balance. Submit as Unpaid anyway?\n\n`+
        `Aviso — a ${name} le queda saldo`+
        (ptoLeft>0?` · PTO: ${fmtNum(ptoLeft)}`:'')+(sickLeft>0?` · Enfermedad: ${fmtNum(sickLeft)}`:'')+
        `. ¿Enviar como Sin goce de todas formas?`;
      if(!confirm(msg)) return;
    }
  }
  state.busy=true;
  const { error } = await db.from('requests').insert({ name, type:cat, detail, duration:dur, start_date:start, end_date:end, start_time:startTime, hours, days, reason, manager_confirmed:!!state.mgr, submitted_by:state.user, status:'pending' });
  state.busy=false;
  if(error){ console.error(error); toast('Could not add · No se pudo agregar'); return; }
  await logAudit('submit', summ({name, cat, detail, dur, start, end, startTime, hours, days}) + (start<today()?' · backdated':''));
  toast('Request added<span class="b-es">Solicitud agregada</span>');
  clearForm(); await loadRequests(); await loadAudit();
}
function summ(r){
  const dl=(DETAIL[r.detail]||CAT[r.cat]||CAT.pto).label;
  if(r.dur==='hourly') return `${dl} · ${r.name} · ${r.start} ${fmt12(r.startTime)} (${r.hours}h)`;
  return `${dl} · ${r.name} · ${r.start}${r.start!==r.end?'→'+r.end:''} (${fmtNum(r.days)}d)`;
}
async function setStatus(id, status){
  const r=state.requests.find(x=>x.id===id); if(!r) return;
  if(status==='cancelled' && !confirm('Cancel this request? It stays on record as Cancelled (not deleted).\n¿Cancelar esta solicitud? Queda registrada como Cancelada (no se borra).')) return;
  const { error } = await db.from('requests').update({ status, reviewed_by:state.user, reviewed_at:new Date().toISOString() }).eq('id', id);
  if(error){ console.error(error); toast('Only admins can do this<span class="b-es">Solo administradores</span>'); return; }
  const act = status==='approved'?'approve':status==='rejected'?'reject':status==='cancelled'?'cancel':'status';
  await logAudit(act, summ(r)); await loadAudit();
  const lbl = status==='approved'?'Approved':status==='rejected'?'Rejected':status==='cancelled'?'Cancelled':'Updated';
  const lblEs = status==='approved'?'Aprobado':status==='rejected'?'Rechazado':status==='cancelled'?'Cancelado':'Actualizado';
  toast(lbl+`<span class="b-es">${lblEs}</span>`);
  await loadRequests();
}
async function cancelReq(id){ return setStatus(id,'cancelled'); }
async function delReq(id){
  const r=state.requests.find(x=>x.id===id);
  if(!confirm('Delete this request? This cannot be undone.\n¿Eliminar esta solicitud? No se puede deshacer.')) return;
  const { error } = await db.from('requests').delete().eq('id', id);
  if(error){ console.error(error); toast('Delete failed — admins only<span class="b-es">Error — solo administradores</span>'); return; }
  if(r) await logAudit('delete', summ(r)); await loadAudit();
  toast('Deleted<span class="b-es">Eliminado</span>'); await loadRequests();
}

  let end=e.start, days=0, startTime=null, hours=null;

  const payload={ name:e.name.trim(), type:cat, detail:e.detail, duration:e.dur, start_date:e.start, end_date:end, start_time:startTime, hours, days, reason:(e.reason&&e.reason.trim())||null, edited_at:new Date().toISOString(), edited_by:state.user };
  const { error } = await db.from('requests').update(payload).eq('id', e.id);
  if(error){ console.error(error); toast('Only admins can edit · Solo administradores'); return; }
  await logAudit('edit', summ({cat,detail:e.detail,name:payload.name,start:e.start,end,dur:e.dur,startTime,hours,days}));
  await loadAudit(); state.editing=null; toast('Saved<span class="b-es">Guardado</span>'); await loadRequests();
}

/* ---- CSV export (opens in Excel; UTF-8 BOM) ---- */
function toCSV(rows){
  if(!rows.length) return '';
  const headers=Object.keys(rows[0]);
  const cell=v=>{ v=(v==null?'':String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[headers.map(cell).join(',')].concat(rows.map(r=>headers.map(h=>cell(r[h])).join(',')));
  return '\uFEFF'+lines.join('\r\n');
}
function downloadCSV(filename, text){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function requestRowsForExport(){
  return filteredRequests().slice().sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt)).map(r=>({
    'Name':r.name,'Category':CAT[r.cat].label,'Detail':(DETAIL[r.detail]||CAT[r.cat]).label,'Duration':DUR[r.dur].en,'Status':STATUS[r.status].en,
    'Date':fmtDate(r.start),'End':(r.dur==='full'?fmtDate(r.end):''),'Start time':((r.dur==='hourly'||r.dur==='half')?fmt12(r.startTime):''),
    'Hours':fmtH(reqHours(r)),'Reason':r.reason||'',
    'Submitted':fmtDT(r.createdAt),'By':r.by||'','Reviewed by':r.reviewedBy||'','Edited by':r.editedBy||''
  }));
}
function exportRequestsCSV(){
  const rows=requestRowsForExport();
  if(!rows.length){ toast('Nothing to export · Nada para exportar'); return; }
  downloadCSV(`PTO_SickLeave_${today()}.csv`, toCSV(rows));
  toast('CSV downloaded<span class="b-es">CSV descargado</span>');
}

    'Sick allowance (h)':allowanceFor(n,'sick'),'Sick used (h)':fmtH(usageFor(n,'sick','approved')),'Sick pending (h)':fmtH(usageFor(n,'sick','pending')),'Sick remaining (h)':fmtH(allowanceFor(n,'sick')-usageFor(n,'sick','approved')),
    'Unpaid used (h)':fmtH(usageFor(n,'unpaid','approved'))

function usageFor(name, kind, status){ return state.requests.filter(r=> r.name===name && reqYear(r)===curYear() && r.cat===kind && r.status===status).reduce((s,r)=>s+reqHours(r),0); }
// approved usage whose start date has been reached (<= today) — "already taken"
function usageReached(name, kind){ const td=today(); return state.requests.filter(r=> r.name===name && reqYear(r)===curYear() && r.cat===kind && r.status==='approved' && (r.start||'')<=td).reduce((s,r)=>s+reqHours(r),0); }
// remaining now = allowance - already-taken approved
function remainingNow(name, kind){ return allowanceFor(name,kind) - usageReached(name,kind); }

let _punchBusy=false;
async function doPunch(kind){
  if(_punchBusy) return; const name=state.user;
  const todays=punchesFor(name, today());
  if(todays.some(p=>p.kind===kind)){ toast('Already punched · Ya registrado'); return; }
  const order=PUNCH.map(p=>p.k), idx=order.indexOf(kind);
  for(let j=0;j<idx;j++){ if(!todays.some(p=>p.kind===order[j])){ toast(`Do "${PK[order[j]].en}" first · Primero ${PK[order[j]].es}`); return; } }
  _punchBusy=true; toast('Getting location… · Obteniendo ubicación…');
  const geo=await getGeo();
  if(!geo){ _punchBusy=false; toast('Turn on location to punch. Try again.<span class="b-es">Activa la ubicación para fichar. Intenta de nuevo.</span>'); return; }
  const lat=geo.lat, lng=geo.lng, acc=Math.round(geo.acc||0);
  // Require a precise (phone GPS) fix. Desktops locate by Wi-Fi/IP with huge error, so block them.
  const ACC_LIMIT=500;
  if(acc>ACC_LIMIT){ _punchBusy=false; toast('Location not precise enough — please punch from your phone (GPS on).<span class="b-es">Ubicación poco precisa — ficha desde tu teléfono con GPS.</span>'); return; }
  const locs=allowedLocationsFor(name);
  let dist=null, locId=null, locName=null;
  if(locs.length){
    let best=null, near=null;
    for(const l of locs){ const dd=distM(l.lat,l.lng,lat,lng);
      if(!near||dd<near.dd) near={l,dd};
      if(dd<=l.radius && (!best||dd<best.dd)) best={l,dd};
    }
    if(!best){ _punchBusy=false; toast(`Too far from your site (${near?near.dd:'?'}m from ${near?esc(near.l.name):'site'}). Punch on-site.<span class="b-es">Estás demasiado lejos de tu sitio. Ficha en el lugar.</span>`); return; }
    dist=best.dd; locId=best.l.id; locName=best.l.name;
  } else {
    toast('No punch site set — recorded without on-site check.');
  }
  const { error } = await db.from('punches').insert({ name, kind, work_date:today(), punched_at:new Date().toISOString(), lat, lng, accuracy:acc, distance_m:dist, location_id:locId, location_name:locName });
  _punchBusy=false;
  if(error){ console.error(error); toast('Punch failed · Error al registrar'); return; }
  toast(`${PK[kind].en} ${fmtT(new Date())}<span class="b-es">Registrado</span>`);
  await loadPunches();
}

function toggleQuick(v){ state.quick = (v==null) ? null : (state.quick===v?null:v); render(); }

function filteredRequests(){
  const f=state.filter, q=state.quick;
  return state.requests.filter(r=>{
    if(state.role==='employee' && r.name!==state.user) return false;
    if(f.person!=='all' && r.name!==f.person) return false;
    if(f.status!=='all' && r.status!==f.status) return false;
    if(f.detail!=='all' && r.detail!==f.detail) return false;
    if(f.month!=='all' && (r.start||'').slice(0,7)!==f.month) return false;
    if(f.from && ((r.end||r.start)||'') < f.from) return false;
    if(f.to && (r.start||'') > f.to) return false;
    if(q==='pending' && r.status!=='pending') return false;
    if(q==='pto' && r.cat!=='pto') return false;
    if(q==='sick' && r.cat!=='sick') return false;
    if(q==='unpaid' && r.cat!=='unpaid') return false;
    return true;
  });
}

}

function reqDetailModal(){

  const rows=[

  const sickHrs=list.filter(r=>r.cat==='sick'&&active(r)).reduce((s,r)=>s+reqHours(r),0);
  const unpaidHrs=list.filter(r=>r.cat==='unpaid'&&active(r)).reduce((s,r)=>s+reqHours(r),0);
  const pending=list.filter(r=>r.status==='pending').length;

function last14PunchPairs(){
  const names=canPunchNames(); const c=new Date(); c.setDate(c.getDate()-13);
  const cutStr=`${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
  const seen=new Set(), pairs=[];
  state.punches.forEach(p=>{ if(!names.includes(p.name)) return; if(p.work_date<cutStr) return; const k=p.name+'|'+p.work_date; if(!seen.has(k)){ seen.add(k); pairs.push({name:p.name,date:p.work_date}); } });
  return pairs.sort((a,b)=> b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
}
function punchAlerts(){
  const offsite=[], missing=[], comment=[];
  for(const pr of last14PunchPairs()){
    const dp=state.punches.filter(p=>p.name===pr.name && p.work_date===pr.date);
    if(dp.some(punchOffsite)) offsite.push(pr);
    const kinds=new Set(dp.map(p=>p.kind));
    if(pr.date<today() && kinds.size<4) missing.push(pr);
    if(notesFor(pr.name,pr.date).length>0) comment.push(pr);
  }
  return {offsite, missing, comment};
}

function leaveForDay(name, ds){
  const dt=new Date(ds+'T00:00:00'); const wd=dt.getDay();
  return state.requests.filter(r=> r.name===name && r.status==='approved' && (r.cat==='pto'||r.cat==='sick'||r.cat==='unpaid') && (
    r.dur==='full' ? (ds>=r.start && ds<=(r.end||r.start) && wd!==0 && wd!==6) : (ds===r.start)
  ));
}
function leaveHoursOnDate(name, ds, paidOnly){
  let h=0;
  for(const r of leaveForDay(name,ds)){ if(paidOnly && r.cat==='unpaid') continue; h += r.dur==='full'?hpd():(r.dur==='half'?hpd()/2:(+r.hours||0)); }
  return h;
}
function setPunchRange(from,to){ state.punchRange={from,to}; render(); }
function punchRangeLast2(){ const t=new Date(); const f=new Date(); f.setDate(f.getDate()-13); const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; state.punchRange={from:ymd(f),to:ymd(t)}; render(); }
function computePunchRows(){
  const names=canPunchNames();
  const rng=state.punchRange, hasR=!!(rng.from&&rng.to);
  const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const td=today();
  let lo, hi;
  if(hasR){ lo=rng.from<rng.to?rng.from:rng.to; hi=rng.from<rng.to?rng.to:rng.from; }
  else { const d=new Date(); d.setDate(d.getDate()-20); lo=ymd(d); hi=td; }
  const inRange=ds=>ds>=lo&&ds<=hi;
  const set=new Map();
  // 1) every weekday in range × every punch-capable employee (blank if not punched)
  if(names.length){ for(let d=new Date(lo+'T00:00:00'), b=new Date(hi+'T00:00:00'); d<=b; d.setDate(d.getDate()+1)){ const wd=d.getDay(); if(wd===0||wd===6) continue; const ds=ymd(d); names.forEach(nm=> set.set(nm+'|'+ds,{name:nm,date:ds})); } }
  // 2) actual punches (incl. weekends) within range
  state.punches.forEach(p=>{ if(!names.includes(p.name))return; if(!inRange(p.work_date))return; set.set(p.name+'|'+p.work_date,{name:p.name,date:p.work_date}); });
  // 3) leave starts on weekend/edge when a range is set
  if(hasR){ state.requests.filter(r=>r.status==='approved'&&names.includes(r.name)&&(r.cat==='pto'||r.cat==='sick'||r.cat==='unpaid')).forEach(r=>{ if(r.dur!=='full' && inRange(r.start)) set.set(r.name+'|'+r.start,{name:r.name,date:r.start}); }); }
  const pairs=[...set.values()].sort((a,b)=> b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  return {names, hasR, lo, hi, pairs};
}
function viewPunch(){
  const G=computePunchRows();
  const names=G.names, hasR=G.hasR, lo=G.lo, hi=G.hi, pairs=G.pairs;
  const rng=state.punchRange;
  // payroll totals over shown pairs
  const paySum = names.map(nm=>{
    const dates=pairs.filter(p=>p.name===nm).map(p=>p.date);

  const rows=(state.punchName?pairs.filter(p=>p.name===state.punchName):pairs).map(({name,date})=>{

    const dayP=state.punches.filter(p=>p.name===name && p.work_date===date);

    const siteTag = siteNames.length?`<div style="font-size:11px;color:var(--soft);margin-bottom:2px">${siteNames.map(esc).join(', ')}</div>`:'';
    const loc = siteTag + (s.anyNo ? `<span class="locbadge loc-no">Some no-loc</span>` : (s.maxD==null?`<span class="locbadge loc-no">—</span>`:(s.anyOff?`<span class="locbadge loc-off">Off-site ${s.maxD}m</span>`:`<span class="locbadge loc-on">On-site ≤${s.maxD}m</span>`)));
    const dn=notesFor(name,date);
    const notesCell = `${dn.length?dn.map(n=>`<div style="font-size:11px;color:var(--soft)">💬 ${esc(n.note)}</div>`).join(''):''}<button class="ghost" style="padding:4px 8px;font-size:11px;margin-top:${dn.length?'4px':'0'}" onclick="addPunchNote('${jsq(name)}','${date}')">+ note</button>`;
    const lv=leaveForDay(name,date);
    const leaveCell = lv.length? lv.map(r=>{ const cb=CAT[r.cat]||CAT.pto; const amt=r.dur==='full'?'full':(r.dur==='half'?'½':`${fmtH(+r.hours||0)}h`); return `<span class="badge ${cb.cls}" style="cursor:pointer" onclick="openReqDetail('${r.id}')" title="View request">${cb.label} ${amt}</span>`; }).join(' ') : '<span style="color:var(--faint)">—</span>';
    const paidH = (s.hrs||0) + leaveHoursOnDate(name,date,true);
    return `<tr>

  // location manager rows

    const boxes = state.locations.length

  }).join('');

  return `
    <div class="card pad reqform" style="margin-bottom:16px">
      <button class="formtoggle" onclick="state.sitesOpen=!state.sitesOpen; render()">

        <span class="chev">${state.sitesOpen?'&#8722;':'&#43;'}</span>

      ${state.sitesOpen?`<div style="margin-top:14px">

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

      </div></div>`:''}
    </div>

    <div class="card pad reqform" style="margin-bottom:16px">
      <button class="formtoggle" onclick="state.whoOpen=!state.whoOpen; render()">
        <span class="sec-title" style="margin:0"><span class="dot"></span><span>Who punches where</span></span>
        <span class="chev">${state.whoOpen?'&#8722;':'&#43;'}</span>
      </button>
      ${state.whoOpen?`<div style="margin-top:14px">
      <div style="font-size:12.5px;color:var(--soft);line-height:1.5">Check the sites each person may punch at. Leave all unchecked to allow any site.</div>
      ${accessRows || '<div style="color:var(--soft);font-size:13px;margin-top:8px">Enable punch for employees in the Balances tab first.</div>'}
      </div>`:''}
    </div>


    <div class="card pad" style="margin-bottom:14px">
      <div class="cal-range" style="margin:0;padding:0;border:none">
        <span style="font-size:12.5px;color:var(--soft)">Pay period:</span>
        <input type="date" value="${esc(rng.from||'')}" onchange="setPunchRange(this.value, state.punchRange.to||this.value)" style="max-width:160px">
        <span style="color:var(--soft)">→</span>
        <input type="date" value="${esc(rng.to||'')}" onchange="setPunchRange(state.punchRange.from||this.value, this.value)" style="max-width:160px">
        <button class="ghost" onclick="punchRangeLast2()" style="padding:7px 11px;font-size:12px">Last 2 weeks</button>
        ${hasR?`<button class="ghost" onclick="setPunchRange('','')" style="padding:7px 11px;font-size:12px">Clear</button>`:''}
      </div>
      ${paySum.length?`<div class="tblwrap" style="margin-top:12px"><table class="tbl">
        <thead><tr><th>Employee</th><th>Worked</th><th>Paid leave (PTO/Sick)</th><th>Total paid</th><th>Unpaid</th></tr></thead>
        <tbody>${paySum.map(x=>`<tr style="cursor:pointer" onclick="state.punchName=(state.punchName==='${jsq(x.nm)}'?null:'${jsq(x.nm)}'); render()" title="Show only this employee's records"><td class="name" style="color:${state.punchName===x.nm?'var(--pto)':'inherit'}">${esc(x.nm)}${state.punchName===x.nm?' ✓':''}</td><td>${x.worked.toFixed(2)}h</td><td>${x.paid.toFixed(2)}h</td><td><b>${x.total.toFixed(2)}h</b></td><td>${x.unpaid?x.unpaid.toFixed(2)+'h':'—'}</td></tr>`).join('')}</tbody>
      </table></div><div style="font-size:11.5px;color:var(--faint);margin-top:6px">Total paid = worked punch hours + approved PTO/Sick. Unpaid is shown separately and not included.</div>`:`<div style="font-size:12.5px;color:var(--soft);margin-top:10px">Pick a pay period (or Last 2 weeks) to see the payroll summary.</div>`}
    </div>

    <div class="list-head"><div><h3>Punch records${hasR?` · ${fmtDate(lo)} → ${fmtDate(hi)}`:''}${state.punchName?` · ${esc(state.punchName)}`:''}</h3><div class="count">${names.length} tracked · ${(state.punchName?pairs.filter(p=>p.name===state.punchName):pairs).length} days${state.punchName?` · <a onclick="state.punchName=null;render()" style="cursor:pointer;color:var(--pto)">show all</a>`:' · tap a name above to filter'}</div></div>
      <div class="headbtns">

      </div></div>
    ${(()=>{ const A=punchAlerts(); return `<div class="stats" style="margin-bottom:14px">

      <div class="stat click" onclick="openPunchAlert('missing')"><div class="n" style="color:var(--warnc)">${A.missing.length}</div><div class="l">Missing punch</div></div>
      <div class="stat click" onclick="openPunchAlert('comment')"><div class="n" style="color:var(--early)">${A.comment.length}</div><div class="l">With comment</div></div>
    </div>`; })()}
    <div class="card"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Name</th><th>Date</th><th>Morning In</th><th>Lunch Out</th><th>Lunch In</th><th>Off Out</th><th>Worked</th><th>Leave</th><th>Paid hrs</th><th>Location</th><th>Comments</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="11" style="text-align:center;color:var(--soft);padding:30px">No records in this range</td></tr>`}</tbody>
    </table></div></div>
    <div class="note">${IC.info}<div>Tap a time to correct a punch — a reason is required and is logged. Punches are never deleted. A punch is blocked if the person is outside their allowed site(s) or has no location. Hours = (Lunch Out − Morning In) + (Off Out − Lunch In).</div></div>
  `;
}
function _punchPairs(){
  const G=computePunchRows();
  return { names:G.names, hasR:G.hasR, lo:G.lo, hi:G.hi, pairs:G.pairs.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name)) };
}
function punchExportRows(){
  const {pairs}=_punchPairs();
  return pairs.map(({name,date})=>{
    const dp=state.punches.filter(p=>p.name===name&&p.work_date===date);
    const t=k=>{const r=dp.find(x=>x.kind===k); return r?fmtT(r.punched_at):'';};
    const worked=workHours(dp);
    const lv=leaveForDay(name,date).map(r=>{const amt=r.dur==='full'?'full':(r.dur==='half'?'half':`${fmtH(+r.hours||0)}h`); return `${(CAT[r.cat]||CAT.pto).label} ${amt}`;}).join(', ');
    const paid=worked+leaveHoursOnDate(name,date,true);
    const site=[...new Set(dp.map(p=>p.location_name).filter(Boolean))].join(', ');
    return {'Name':name,'Date':date,'Morning In':t('morning_in'),'Lunch Out':t('lunch_out'),'Lunch In':t('lunch_in'),'Off Out':t('off_out'),'Worked (h)':worked?+worked.toFixed(2):0,'Leave':lv,'Paid hours (h)':paid?+paid.toFixed(2):0,'Site':site};
  });
}
function payrollRows(){
  const {names,pairs}=_punchPairs();
  return names.map(nm=>{ const dates=pairs.filter(p=>p.name===nm).map(p=>p.date); let w=0,p=0,u=0; dates.forEach(ds=>{w+=workHours(state.punches.filter(x=>x.name===nm&&x.work_date===ds)); p+=leaveHoursOnDate(nm,ds,true); u+=(leaveHoursOnDate(nm,ds,false)-leaveHoursOnDate(nm,ds,true));}); return {'Employee':nm,'Worked (h)':+w.toFixed(2),'Paid leave (h)':+p.toFixed(2),'Total paid (h)':+(w+p).toFixed(2),'Unpaid (h)':+u.toFixed(2)}; }).filter(x=>x['Worked (h)']||x['Paid leave (h)']||x['Unpaid (h)']);
}
function _rangeTag(){ const {hasR,lo,hi}=_punchPairs(); return hasR?`${lo}_to_${hi}`:today(); }
function exportPunchesCSV(){ const rows=punchExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; } downloadCSV(`Punches_${_rangeTag()}.csv`, toCSV(rows)); toast('CSV downloaded<span class="b-es">CSV descargado</span>'); }
function exportPunchesXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel module still loading'); return; }
  const rows=punchExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows); ws['!cols']=[{wch:16},{wch:12},{wch:11},{wch:11},{wch:11},{wch:11},{wch:10},{wch:16},{wch:11},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws,'Punches');
  const pr=payrollRows(); if(pr.length){ const ws2=XLSX.utils.json_to_sheet(pr); ws2['!cols']=[{wch:18},{wch:11},{wch:14},{wch:13},{wch:11}]; XLSX.utils.book_append_sheet(wb,ws2,'Payroll'); }
  XLSX.writeFile(wb,`Punches_${_rangeTag()}.xlsx`);
  toast('Excel downloaded<span class="b-es">Excel descargado</span>');
}

/* ---------- approved PTO/Sick calendar (admin) ---------- */
function calCur(){ return state.calMonth || today().slice(0,7); }
function calShift(delta){ const [y,m]=calCur().split('-').map(Number); const d=new Date(y, m-1+delta, 1); state.calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; render(); }
function calToday(){ state.calMonth=today().slice(0,7); render(); }
function reqCoversDate(r, ds){ if(r.status!=='approved') return false; if(r.cat!=='pto'&&r.cat!=='sick') return false; if(r.dur==='full'){ const dt=new Date(ds+'T00:00:00'); const wd=dt.getDay(); if(wd===0||wd===6) return false; return ds>=r.start && ds<=(r.end||r.start); } return ds===r.start; }
function requestsOnDate(ds){ return state.requests.filter(r=>reqCoversDate(r,ds)); }
function setCalDay(ds){ state.calDay=ds; render(); }
function closeCalDay(){ state.calDay=null; render(); }
function calDayModal(){
  const ds=state.calDay; if(!ds) return '';
  const list=requestsOnDate(ds);
  const rows = list.length ? list.map(r=>{ const cb=CAT[r.cat]||CAT.pto; return `<div class="drow" style="cursor:pointer" onclick="state.calDay=null; openReqDetail('${r.id}')"><span class="k">${esc(r.name)} <span class="badge ${cb.cls}" style="margin-left:4px">${cb.label}</span></span><span class="v">${fmtH(reqHours(r))}h ›</span></div>`; }).join('') : `<div style="color:var(--soft);padding:10px 0">No approved time off on this day.</div>`;
  return `<div class="overlay" onclick="if(event.target===this)closeCalDay()"><div class="modal">
    <h3>${IC.cal} ${fmtDate(ds)}</h3>
    <div style="margin-top:10px">${rows}</div>
    <div class="modal-actions"><button class="cancel" style="flex:1" onclick="closeCalDay()">Close</button></div>
  </div></div>`;
}
function calendarCard(){
  const ym=calCur(); const [y,m]=ym.split('-').map(Number);
  const first=new Date(y, m-1, 1); const startWd=first.getDay(); const dim=new Date(y, m, 0).getDate();
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=0;i<startWd;i++) cells+=`<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=dim; d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const list=requestsOnDate(ds);
    const isToday = ds===today();
    const chips = list.slice(0,3).map(r=>{ const isP=r.cat==='pto'; return `<div class="cal-chip ${isP?'cal-pto':'cal-sick'}" title="${esc(r.name)} · ${isP?'PTO':'Sick'}">${esc(r.name.split(' ')[0])}</div>`; }).join('');
    const more = list.length>3?`<div class="cal-more">+${list.length-3}</div>`:'';
    cells+=`<div class="cal-cell${isToday?' cal-today':''}${list.length?' cal-has':''}" onclick="setCalDay('${ds}')"><div class="cal-d">${d}</div>${chips}${more}</div>`;
  }
  const wdh=WD.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  return `<div class="card pad" style="margin-bottom:16px">
    <div class="cal-head">
      <div class="sec-title" style="margin:0"><span class="dot"></span><span>Approved time off</span></div>
      <div class="cal-nav">
        <button class="ghost" onclick="calShift(-1)" style="padding:6px 11px">‹</button>
        <span style="font-weight:700;min-width:130px;text-align:center">${MN[m-1]} ${y}</span>
        <button class="ghost" onclick="calShift(1)" style="padding:6px 11px">›</button>
        <button class="ghost" onclick="calToday()" style="padding:6px 11px;font-size:12px">Today</button>
      </div>
    </div>
    <div class="cal-legend"><span class="cal-chip cal-pto" style="display:inline-block">PTO</span> <span class="cal-chip cal-sick" style="display:inline-block">Sick</span> <span style="color:var(--soft);font-size:12px">· tap a day for details</span></div>
    <div class="cal-grid">${wdh}${cells}</div>
    <div class="cal-range">
      <span style="font-size:12.5px;color:var(--soft)">Date range:</span>
      <input type="date" value="${esc(state.calRange.from||'')}" onchange="state.calRange.from=this.value; render()" style="max-width:160px">
      <span style="color:var(--soft)">→</span>
      <input type="date" value="${esc(state.calRange.to||'')}" onchange="state.calRange.to=this.value; render()" style="max-width:160px">
      ${(state.calRange.from||state.calRange.to)?`<button class="ghost" onclick="state.calRange={from:'',to:''}; render()" style="padding:7px 11px;font-size:12px">Clear</button>`:''}
    </div>
    ${calRangeList()}
  </div>`;
}
function calRangeList(){
  const f=state.calRange.from, t=state.calRange.to; if(!f||!t) return '';
  const lo=f<t?f:t, hi=f<t?t:f;
  const list=state.requests.filter(r=>(r.cat==='pto'||r.cat==='sick')&&r.status==='approved'&&(r.start||'')<=hi&&((r.end||r.start)||'')>=lo).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  if(!list.length) return `<div style="color:var(--soft);font-size:13px;margin-top:12px">No approved PTO/Sick between ${fmtDate(lo)} and ${fmtDate(hi)}.</div>`;
  return `<div style="margin-top:14px"><div style="font-weight:700;font-size:13.5px;margin-bottom:8px">${fmtDate(lo)} → ${fmtDate(hi)} · ${list.length} approved</div>
    ${list.map(r=>{ const cb=CAT[r.cat]||CAT.pto; const dl=r.start===(r.end||r.start)?fmtDate(r.start):`${fmtDate(r.start)} → ${fmtDate(r.end)}`; return `<div class="drow" style="cursor:pointer" onclick="openReqDetail('${r.id}')"><span class="k">${esc(r.name)} <span class="badge ${cb.cls}" style="margin-left:4px">${cb.label}</span></span><span class="v">${dl} · ${fmtH(reqHours(r))}h ›</span></div>`; }).join('')}</div>`;
}

function reqRow(r,isAdmin){
  const catB=CAT[r.cat]||CAT.pto, detB=DETAIL[r.detail], st=STATUS[r.status]||STATUS.pending;
  const showDet = detB && detB.label!==catB.label;
  let dateLine, amount;
  if(r.dur==='hourly'){
    dateLine = `${fmtDate(r.start)} · ${fmt12(r.startTime)} → ${fmt12(addHours(r.startTime, r.hours))}`;
    amount = `${fmtH(reqHours(r))}h`;
  } else if(r.dur==='half'){
    const hh = r.startTime ? ` · ${fmt12(r.startTime)} → ${fmt12(addHours(r.startTime, hpd()/2))}` : '';
    dateLine = `${fmtDate(r.start)} · Half day${hh}`;
    amount = `${fmtH(reqHours(r))}h`;
  } else {
    dateLine = r.start===r.end?fmtDate(r.start):`${fmtDate(r.start)} → ${fmtDate(r.end)}`;
    amount = `${fmtH(reqHours(r))}h`;
  }
  const reviewed = r.reviewedBy ? ` · ${st.en} by ${esc(r.reviewedBy)}` : '';
  const edited = r.editedBy ? ` · edited by ${esc(r.editedBy)}` : '';
  const mgrTag = r.mgr===true
    ? `<span class="sbadge" style="color:var(--ok);background:var(--ok-bg)" title="Manager confirmed">${bl('Mgr ✓','Gerente ✓')}</span>`
    : `<span class="sbadge" style="color:var(--warnc);background:var(--warn-bg)" title="Manager not confirmed">${bl('Unconfirmed','Sin confirmar')}</span>`;
  let balChip='';
  if(isAdmin){
    const pr=remainingProjected(r.name,'pto'), sr=remainingProjected(r.name,'sick');
    balChip = `<span class="req-days" style="color:var(--soft)"> · PTO ${fmtH(pr)}h · Sick ${fmtH(sr)}h left</span>`;
  }
  return `<div class="req${r.status==='cancelled'?' req-cancelled':''}${r.status==='rejected'?' req-rejected':''}" onclick="openReqDetail('${r.id}')" style="cursor:pointer">
    <div class="badges">
      <span class="badge ${catB.cls}">${catB.label}<span class="es">${catB.es}</span></span>
      ${showDet?`<span class="badge ${detB.cls}">${detB.label}<span class="es">${detB.es}</span></span>`:''}
      <span class="sbadge" style="color:${st.c};background:${st.bg}">${bl(st.en,st.es)}</span>
      ${mgrTag}
      ${(r.start && r.start<today())?`<span class="sbadge" style="color:var(--early);background:var(--half-bg)" title="Submitted for a past date">${bl('Backdated','Retroactivo')}</span>`:''}
    </div>
    <div class="req-main">
      <div class="req-top"><span class="req-name">${esc(r.name)}</span><span class="req-days">· ${amount}</span>${balChip}</div>
      <div class="req-dates">${dateLine}</div>
      ${r.reason?`<div class="req-reason">${esc(r.reason)}</div>`:''}
      <div class="req-meta">${blslash('Submitted','Enviado')} ${fmtDT(r.createdAt)}${r.by?` · ${esc(r.by)}`:''}${reviewed}${edited}</div>
    </div>
    ${isAdmin?`<div class="acts" onclick="event.stopPropagation()">
      <button class="act ok ${r.status==='approved'?'on':''}" title="Approve · Aprobar" onclick="setStatus('${r.id}','approved')">${IC.check}</button>
      <button class="act no ${r.status==='rejected'?'on':''}" title="Reject · Rechazar" onclick="setStatus('${r.id}','rejected')">${IC.x}</button>
      <button class="act edit" title="Edit · Editar" onclick="openEdit('${r.id}')">${IC.pencil}</button>
      <button class="act del" title="Cancel · Cancelar" onclick="setStatus('${r.id}','cancelled')">${IC.trash}</button>
    </div>`:''}
  </div>`;
}

/* ---------- Balances view (admin) ---------- */
function viewBalances(){
  _names=allEmployeeNames();
  const rows=_names.map((n,i)=>{
    const pA=allowanceFor(n,'pto'), pU=usageFor(n,'pto','approved'), pR=pA-pU;
    const sA=allowanceFor(n,'sick'), sU=usageFor(n,'sick','approved'), sR=sA-sU;
    const uU=usageFor(n,'unpaid','approved');
    const ov=state.employees[n]||{};
    const inRoster=Object.prototype.hasOwnProperty.call(state.employees,n);
    const isActive=inRoster && ov.active!==false;
    const pv=ov.pto_allowance!=null?ov.pto_allowance:'', sv=ov.sick_allowance!=null?ov.sick_allowance:'';
    return `<tr${isActive?'':' style="opacity:.6"'}>
      <td class="name">${esc(n)}${!inRoster?' <span style="font-size:10px;color:var(--faint)">(not on roster)</span>':(isActive?'':' <span style="font-size:10px;color:var(--danger)">(inactive)</span>')}</td>
      <td><input type="number" min="0" step="1" value="${stagedVal(n,'pto',ov.pto_allowance)}" placeholder="${fmtNum(+state.settings.pto_allowance||0)}" onchange="stageAllow('${jsq(n)}','pto',this.value)"></td>
      <td>${fmtH(pU)}h</td><td class="${pR<=8?'rem-low':'rem-ok'}">${fmtH(pR)}h</td>
      <td><input type="number" min="0" step="1" value="${stagedVal(n,'sick',ov.sick_allowance)}" placeholder="${fmtNum(+state.settings.sick_allowance||0)}" onchange="stageAllow('${jsq(n)}','sick',this.value)"></td>
      <td>${fmtH(sU)}h</td><td class="${sR<=8?'rem-low':'rem-ok'}">${fmtH(sR)}h</td>
      <td>${fmtH(uU)}h</td>
      <td style="text-align:center">${inRoster ? `<input type="checkbox" ${ov.can_punch?'checked':''} onchange="setPunchByIdx(${i}, this.checked)" style="width:auto;cursor:pointer">` : ''}</td>
      <td>${inRoster ? `<input type="text" value="${esc(state.codes[n]!=null?state.codes[n]:'')}" placeholder="set code" style="width:96px" onchange="setCodeByIdx(${i},this.value)">` : `<span style="color:var(--faint);font-size:11px">—</span>`}</td>
      <td style="white-space:nowrap">${!inRoster
        ? `<button class="ghost" style="padding:5px 8px;font-size:11px" title="Add to roster" onclick="addToRosterByIdx(${i})">+ roster</button>`
        : (isActive
          ? `<button class="ghost" style="padding:5px 9px;font-size:11px;color:var(--danger);border-color:var(--danger)" title="Deactivate (keeps records)" onclick="setActiveByIdx(${i},false)">Deactivate</button>`
          : `<button class="ghost" style="padding:5px 9px;font-size:11px;color:var(--ok);border-color:var(--ok)" title="Reactivate" onclick="setActiveByIdx(${i},true)">Activate</button>`)}</td>
    </tr>`;
  }).join('');
  return `
    <div class="card pad" style="margin-bottom:16px">
      <div class="sec-title"><span class="dot"></span><span>Team roster${es('Lista del equipo')}</span></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end">
        <div class="field" style="margin:0; flex:1; min-width:200px"><label>Add employee (exact name)${es('Agregar empleado (nombre exacto)')}</label><input id="newEmp" placeholder="e.g. Maria Lopez" onkeydown="if(event.key==='Enter')addEmployee()"></div>
        <button class="submit" onclick="addEmployee()" style="padding:12px 20px">Add<span class="b-es">Agregar</span></button>
      </div>
      <div style="font-size:12px;color:var(--soft);margin-top:10px;line-height:1.5">${rosterNames().length} on the roster. Give each person a <b>Login code</b> in the table below — employees log in with that code only (their name is never shown in a list).<span class="es" style="margin-top:2px">${rosterNames().length} en la lista. Asigna un código de acceso a cada uno abajo; los empleados inician sesión solo con ese código.</span></div>
    </div>
    <div class="card pad" style="margin-bottom:16px">
      <div class="sec-title"><span class="dot"></span><span>Defaults${es('Valores predeterminados')}</span></div>
      <div class="default-allow">
        <div class="field"><label>PTO hours/yr${es('Vacaciones h/año')}</label><input type="number" min="0" step="1" value="${fmtNum(+state.settings.pto_allowance||0)}" onchange="setDefault('pto_allowance',this.value)"></div>
        <div class="field"><label>Sick hours/yr${es('Enfermedad h/año')}</label><input type="number" min="0" step="1" value="${fmtNum(+state.settings.sick_allowance||0)}" onchange="setDefault('sick_allowance',this.value)"></div>
        <div class="field"><label>Hours / work day${es('Horas / jornada')}</label><input type="number" min="1" step="1" value="${fmtNum(hpd())}" onchange="setDefault('hours_per_day',this.value)"></div>
        <span style="font-size:12px;color:var(--soft);line-height:1.4;max-width:230px">All balances are in hours. Full day = this many hours.<span class="es">Todos los saldos en horas. Día completo = estas horas.</span></span>
      </div>
    </div>
    <div class="list-head"><div><h3>Balances ${curYear()}</h3><div class="count">Edit allowances (hours), then press Save. Used = approved requests dated this year</div></div>
      <div class="headbtns">

        <button class="export" onclick="exportExcel()">${IC.excel}<span class="txt">Excel .xlsx<span class="b-es">Excel .xlsx</span></span></button>
      </div></div>
    <div class="card"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Name</th><th>PTO allow. (h)</th><th>PTO used (h)</th><th>PTO left (h)</th><th>Sick allow. (h)</th><th>Sick used (h)</th><th>Sick left (h)</th><th>Unpaid used (h)</th><th>Punch</th><th>Login code</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="11" style="text-align:center;color:var(--soft);padding:30px">No employees yet — add someone above · Aún no hay empleados</td></tr>`}</tbody>
    </table></div></div>
    ${(()=>{ const d=allowDirtyCount(); return d>0
      ? `<div class="savebar"><span><b>${d}</b> unsaved change${d===1?'':'s'}</span><span style="display:flex;gap:8px"><button class="ghost" onclick="discardAllowEdits()">Discard</button><button class="submit" onclick="saveAllowances()">Save changes</button></span></div>`
      : `<div style="margin-top:12px;text-align:right"><button class="submit" onclick="saveAllowances()" disabled style="opacity:.5;cursor:default">Save changes</button></div>`; })()}
    <div class="note">${IC.info}<div>Edit PTO/Sick allowance cells (in hours), then press <b>Save changes</b> — every change is logged in the Audit log (old → new). Add your team above and set each person's <b>Login code</b>; employees sign in with that code (names are never listed). Blank allowance = use the default.</div></div>
  `;
}

/* ---------- Audit view (admin) ---------- */
async function auditExportRows(){
  const ACTL={ submit:'Submitted', approve:'Approved', reject:'Rejected', cancel:'Cancelled', delete:'Deleted', edit:'Edited', punchedit:'Punch edited', allowance:'Allowance', setting:'Setting', roster:'Roster', code:'Login code', punchset:'Punch access', punchdel:'Punch deleted' };
  let data=state.audit||[];
  try{ const res=await db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(10000); if(res.data) data=res.data; }catch(e){ console.error(e); }
  return data.map(a=>({
    'Date/Time':fmtDT(a.created_at),
    'Action':ACTL[a.action]||a.action,
    'Detail (incl. reason / old → new)':a.detail||'',
    'By':a.actor||''
  }));
}
async function exportAuditCSV(){
  const rows=await auditExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; }
  downloadCSV(`Audit_log_${today()}.csv`, toCSV(rows)); toast('CSV downloaded<span class="b-es">CSV descargado</span>');
}
async function exportAuditXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel module still loading'); return; }
  const rows=await auditExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; }
  const wb=XLSX.utils.book_new(); const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:20},{wch:14},{wch:60},{wch:24}];
  XLSX.utils.book_append_sheet(wb,ws,'Audit log'); XLSX.writeFile(wb,`Audit_log_${today()}.xlsx`);
  toast('Excel downloaded<span class="b-es">Excel descargado</span>');
}
function viewAudit(){
  const ACT={ submit:{en:'Submitted',c:'var(--early)'}, approve:{en:'Approved',c:'var(--ok)'}, reject:{en:'Rejected',c:'var(--warnc)'}, cancel:{en:'Cancelled',c:'var(--soft)'}, delete:{en:'Deleted',c:'var(--danger)'}, edit:{en:'Edited',c:'var(--half)'}, punchedit:{en:'Punch edited',c:'var(--half)'}, allowance:{en:'Allowance',c:'var(--half)'}, setting:{en:'Setting',c:'var(--half)'}, roster:{en:'Roster',c:'var(--early)'}, code:{en:'Login code',c:'var(--early)'}, punchset:{en:'Punch access',c:'var(--early)'}, punchdel:{en:'Punch deleted',c:'var(--danger)'} };
  const rows=(state.audit||[]).map(a=>{ const m=ACT[a.action]||{en:a.action,c:'var(--soft)'};
    return `<tr><td style="white-space:nowrap"><span class="sbadge" style="color:${m.c};background:var(--line-2)">${m.en}</span></td><td>${esc(a.detail||'')}</td><td style="white-space:nowrap">${esc(a.actor||'')}</td><td style="white-space:nowrap;color:var(--soft)">${fmtDT(a.created_at)}</td></tr>`;
  }).join('');
  return `
    <div class="list-head"><div><h3>Audit log</h3><div class="count">Every action, with details (reasons, old → new)</div></div>
      <div class="headbtns">
        <button class="csv" onclick="exportAuditCSV()">${IC.csv}<span class="txt">CSV (Excel)</span></button>
        <button class="export" onclick="exportAuditXLSX()">${IC.excel}<span class="txt">Excel .xlsx</span></button>
      </div></div>
    <div class="card"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Action</th><th>Detail</th><th>Admin</th><th>When</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" style="text-align:center;color:var(--soft);padding:30px">No activity yet · Sin actividad</td></tr>`}</tbody>
    </table></div></div>
    <div class="note">${IC.info}<div>Records admin actions only. Deleted requests keep a summary line here.${es('Registra solo acciones de administradores. Las solicitudes eliminadas dejan un resumen aquí.')}</div></div>
  `;
}

/* ============ boot ============ */
(async function(){
  if(!CONFIGURED){ render(); return; }
  try{ await Promise.all([loadSettings(), loadEmployees()]); }catch(e){ console.error(e); }
  try{ const { data:{ session } } = await db.auth.getSession(); if(session){ state.role='admin'; state.user=session.user.email; return enterDash(); } }catch(e){ console.error(e); }
  const emp=ssGet('pto_emp');
  if(emp && rosterNames().includes(emp)){ state.role='employee'; state.user=emp; return enterDash(); }
  if(emp) ssDel('pto_emp'); // stored name no longer on the roster
  state.screen='login'; render();
})();
</script>
