              {k:'lunch_out', en:'Lunch Out', es:'Salida almuerzo',io:'out'},
              {k:'lunch_in',  en:'Lunch In',  es:'Regreso almuerzo',io:'in'},
              {k:'off_out',   en:'Off Work Out',es:'Salida',io:'out'} ];
const PK={}; PUNCH.forEach(p=>PK[p.k]=p);
function getGeo(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}), ()=>res(null), {enableHighAccuracy:true,timeout:10000,maximumAge:0}); }); }
function distM(aLat,aLng,bLat,bLng){ const R=6371000,toR=x=>x*Math.PI/180; const dLat=toR(bLat-aLat),dLng=toR(bLng-aLng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(aLat))*Math.cos(toR(bLat))*Math.sin(dLng/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(s))); }
function officeLoc(){ const la=parseFloat(state.settings.office_lat), ln=parseFloat(state.settings.office_lng); return (!isNaN(la)&&!isNaN(ln))?{lat:la,lng:ln}:null; }

function fmtT(v){ if(!v) return ''; const x=new Date(v); let h=x.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(x.getMinutes()).padStart(2,'0')} ${ap}`; }
function workHours(day){ const t=k=>{ const p=day.find(x=>x.kind===k); return p?new Date(p.punched_at).getTime():null; };
  const mi=t('morning_in'),lo=t('lunch_out'),li=t('lunch_in'),oo=t('off_out'); let ms=0;
  if(mi&&lo&&li&&oo){ ms=(lo-mi)+(oo-li); } else if(mi&&oo&&!lo&&!li){ ms=oo-mi; } else { if(mi&&lo) ms+=lo-mi; if(li&&oo) ms+=oo-li; }
  return ms>0?ms/3600000:0; }

function fmtDate(d){ if(!d) return ''; const x=new Date(d+'T00:00:00'); return `${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()}`; }
function fmtDT(v){ const x=new Date(v); let h=x.getHours(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${MON[x.getMonth()]} ${x.getDate()}, ${x.getFullYear()} ${h}:${String(x.getMinutes()).padStart(2,'0')} ${ap}`; }
function fmt12(hhmm){ if(!hhmm) return ''; const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'PM':'AM'; const hh=h%12||12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function addHours(hhmm,hrs){ if(!hhmm) return ''; let [h,m]=hhmm.split(':').map(Number); let tot=h*60+m + Math.round(hrs*60); tot=((tot%1440)+1440)%1440; const H=Math.floor(tot/60), M=tot%60; return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`; }
function today(){ return new Date().toISOString().slice(0,10); }

async function submitReq(){
  if(state.busy) return;
  const name=val('rName').trim(), cat=state.cat, detail=state.detail, dur=state.dur, start=val('rStart');
  if(!name) return toast('Enter a name<span class="b-es">Ingresa un nombre</span>');
  if(!start) return toast('Pick a start date<span class="b-es">Elige la fecha de inicio</span>');
  let end=start, days=0, startTime=null, hours=null;
  if(dur==='full'){
    end=val('rEnd'); if(!end) return toast('Pick an end date<span class="b-es">Elige la fecha de fin</span>');
    days=daysBetween(start,end);
  } else if(dur==='half'){
    startTime=val('rTime'); if(!startTime) return toast('Pick a start time<span class="b-es">Elige la hora de inicio</span>');
    days=0.5;
  } else { // hourly
    startTime=val('rTime'); hours=parseInt(val('rHours'),10);
    if(!startTime) return toast('Pick a start time<span class="b-es">Elige la hora de inicio</span>');
    if(!hours || hours<=0) return toast('Enter hours (whole)<span class="b-es">Ingresa las horas (enteras)</span>');
    days = Math.round((hours/hpd())*100)/100;
  }
  if(cat==='unpaid'){
    const ptoLeft=allowanceFor(name,'pto')-usageFor(name,'pto','approved');
    const sickLeft=allowanceFor(name,'sick')-usageFor(name,'sick','approved');
    if(ptoLeft>0 || sickLeft>0){
      const msg=`Heads up — ${name} still has balance left:\n`+
        (ptoLeft>0?`  • PTO: ${fmtNum(ptoLeft)} day(s)\n`:'')+
        (sickLeft>0?`  • Sick: ${fmtNum(sickLeft)} day(s)\n`:'')+
        `\nUnpaid does not use any balance. Submit as Unpaid anyway?\n\n`+
        `Aviso — a ${name} le queda saldo`+
        (ptoLeft>0?` · PTO: ${fmtNum(ptoLeft)}`:'')+(sickLeft>0?` · Enfermedad: ${fmtNum(sickLeft)}`:'')+
        `. ¿Enviar como Sin goce de todas formas?`;
      if(!confirm(msg)) return;
    }
  }
  state.busy=true;
  const { error } = await db.from('requests').insert({ name, type:cat, detail, duration:dur, start_date:start, end_date:end, start_time:startTime, hours, days, reason:(val('rReason').trim()||null), submitted_by:state.user, status:'pending' });
  state.busy=false;
  if(error){ console.error(error); toast('Could not add · No se pudo agregar'); return; }
  toast('Request added<span class="b-es">Solicitud agregada</span>');
  clearForm(); await loadRequests();
}
function summ(r){

  return `${dl} · ${r.name} · ${r.start}${r.start!==r.end?'→'+r.end:''} (${fmtNum(r.days)}d)`;
}

/* ---- CSV export (opens in Excel; UTF-8 BOM) ---- */
function toCSV(rows){
  if(!rows.length) return '';
  const headers=Object.keys(rows[0]);
  const cell=v=>{ v=(v==null?'':String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[headers.map(cell).join(',')].concat(rows.map(r=>headers.map(h=>cell(r[h])).join(',')));
  return '\uFEFF'+lines.join('\r\n');
}
function downloadCSV(filename, text){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

    'Date':fmtDate(r.start),'End':(r.dur==='full'?fmtDate(r.end):''),'Start time':((r.dur==='hourly'||r.dur==='half')?fmt12(r.startTime):''),

    'Submitted':fmtDT(r.createdAt),'By':r.by||'','Reviewed by':r.reviewedBy||'','Edited by':r.editedBy||''
  }));
}

let _punchBusy=false;
async function doPunch(kind){
  if(_punchBusy) return; const name=state.user;
  const todays=punchesFor(name, today());
  if(todays.some(p=>p.kind===kind)){ toast('Already punched · Ya registrado'); return; }
  const order=PUNCH.map(p=>p.k), idx=order.indexOf(kind);
  for(let j=0;j<idx;j++){ if(!todays.some(p=>p.kind===order[j])){ toast(`Do "${PK[order[j]].en}" first · Primero ${PK[order[j]].es}`); return; } }
  _punchBusy=true; toast('Getting location… · Obteniendo ubicación…');
  const geo=await getGeo();
  let lat=null,lng=null,acc=null,dist=null;
  if(geo){ lat=geo.lat; lng=geo.lng; acc=Math.round(geo.acc); const o=officeLoc(); if(o) dist=distM(o.lat,o.lng,lat,lng); }
  const { error } = await db.from('punches').insert({ name, kind, work_date:today(), punched_at:new Date().toISOString(), lat, lng, accuracy:acc, distance_m:dist });
  _punchBusy=false;
  if(error){ console.error(error); toast('Punch failed · Error al registrar'); return; }
  toast(`${PK[kind].en} ${fmtT(new Date())}${geo?'':' · No location'}<span class="b-es">Registrado</span>`);
  await loadPunches();
}
async function delPunchDay(name, date){
  if(!confirm(`Delete all punches for ${name} on ${date}?\n¿Eliminar los registros de ${name} el ${date}?`)) return;
  const { error } = await db.from('punches').delete().eq('name', name).eq('work_date', date);
  if(error){ console.error(error); toast('Only admins · Solo administradores'); return; }
  await logAudit('punchdel', `${name} · ${date}`); await loadAudit();
  toast('Deleted<span class="b-es">Eliminado</span>'); await loadPunches();
}
async function useCurrentOffice(){
  toast('Getting location… · Obteniendo ubicación…');
  const g=await getGeo();
  if(!g){ toast('Location unavailable · Ubicación no disponible'); return; }
  await db.from('settings').upsert({key:'office_lat',value:String(g.lat)},{onConflict:'key'});
  await db.from('settings').upsert({key:'office_lng',value:String(g.lng)},{onConflict:'key'});
  await logAudit('setting', `office set to ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}`);
  await loadSettings(); await loadAudit(); toast('Office location saved<span class="b-es">Ubicación guardada</span>'); render();
}
async function removeEmployee(i){
  const name=_names[i]; if(name==null) return;
  if(!confirm(`Remove ${name} from the roster? Their past requests stay.\n¿Quitar a ${name} de la lista? Sus solicitudes se conservan.`)) return;
  const { error } = await db.from('employees').delete().eq('name', name);
  if(error){ console.error(error); toast('Could not remove · No se pudo quitar'); return; }
  await logAudit('roster', `removed ${name}`); await loadEmployees(); await loadAudit();
  toast('Removed<span class="b-es">Quitado</span>'); render();
}

/* ============ excel ============ */
function exportExcel(){
  if(typeof XLSX==='undefined'){ toast('Excel module still loading<span class="b-es">El módulo aún se carga</span>'); return; }
  const list=filteredRequests(); if(!list.length){ toast('Nothing to export · Nada para exportar'); return; }
  const rows=list.slice().sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt)).map(r=>({
    'Name / Nombre':r.name,'Category / Categoría':`${CAT[r.cat].label} (${CAT[r.cat].es})`,'Detail / Detalle':(DETAIL[r.detail]||CAT[r.cat]).label,'Duration / Duración':DUR[r.dur].en,
    'Status / Estado':STATUS[r.status].en,'Date / Fecha':fmtDate(r.start),'End / Fin':(r.dur==='full'?fmtDate(r.end):''),
    'Start time / Hora':((r.dur==='hourly'||r.dur==='half')?fmt12(r.startTime):''),'Hours / Horas':(r.dur==='hourly'?r.hours:''),
    'Days / Días':r.days,'Reason / Motivo':r.reason||'','Submitted / Enviado':fmtDT(r.createdAt),'By / Por':r.by||'','Reviewed by / Revisado':r.reviewedBy||''
  }));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:20},{wch:14},{wch:14},{wch:12},{wch:15},{wch:15},{wch:12},{wch:9},{wch:9},{wch:24},{wch:22},{wch:16},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'Requests');
  const bnames=allEmployeeNames();
  if(bnames.length){
    const brows=bnames.map(n=>({ 'Name / Nombre':n,
      'PTO allowance':allowanceFor(n,'pto'),'PTO used':usageFor(n,'pto','approved'),'PTO pending':usageFor(n,'pto','pending'),'PTO remaining':allowanceFor(n,'pto')-usageFor(n,'pto','approved'),
      'Sick allowance':allowanceFor(n,'sick'),'Sick used':usageFor(n,'sick','approved'),'Sick pending':usageFor(n,'sick','pending'),'Sick remaining':allowanceFor(n,'sick')-usageFor(n,'sick','approved'),
      'Unpaid used':usageFor(n,'unpaid','approved') }));
    const bws=XLSX.utils.json_to_sheet(brows);
    bws['!cols']=[{wch:16},{wch:13},{wch:10},{wch:11},{wch:13},{wch:13},{wch:10},{wch:11},{wch:13},{wch:12}];
    XLSX.utils.book_append_sheet(wb,bws,`Balances ${curYear()}`);
  }
  XLSX.writeFile(wb,`PTO_SickLeave_${today()}.xlsx`);
  toast('Excel downloaded<span class="b-es">Excel descargado</span>');
}

/* ============ filtering ============ */
function filteredRequests(){
  const f=state.filter;
  return state.requests.filter(r=>{
    if(f.person!=='all' && r.name!==f.person) return false;
    if(f.status!=='all' && r.status!==f.status) return false;
    if(f.detail!=='all' && r.detail!==f.detail) return false;
    if(f.month!=='all' && (r.start||'').slice(0,7)!==f.month) return false;
    return true;
  });
}

function locBadge(rec){
  if(rec.lat==null || rec.lng==null) return `<span class="locbadge loc-no">No location</span>`;
  if(rec.distance_m==null) return `<a class="locbadge loc-no maplink" href="https://maps.google.com/?q=${rec.lat},${rec.lng}" target="_blank">Map (no office set)</a>`;
  const on=rec.distance_m<=officeRadius();
  return `<a class="locbadge ${on?'loc-on':'loc-off'} maplink" href="https://maps.google.com/?q=${rec.lat},${rec.lng}" target="_blank">${on?'On-site':'Off-site'} ${rec.distance_m}m</a>`;
}
function punchCard(name){
  const day=punchesFor(name, today());
  const done=day.map(p=>p.kind);
  const nextIdx=PUNCH.findIndex(p=>!done.includes(p.k));
  const cells=PUNCH.map((p,i)=>{
    const rec=day.find(x=>x.kind===p.k);
    if(rec){ return `<div class="pbtn done"><div class="pk">${p.en}<span class="es">${p.es}</span></div><div class="ph">${fmtT(rec.punched_at)}</div>${locBadge(rec)}</div>`; }
    if(i===nextIdx){ return `<div class="pbtn todo" onclick="doPunch('${p.k}')"><div class="pk">${p.en}<span class="es">${p.es}</span></div><div class="ph">Tap to punch</div></div>`; }
    return `<div class="pbtn wait"><div class="pk">${p.en}<span class="es">${p.es}</span></div><div class="ph">—</div></div>`;
  }).join('');
  const hrs=workHours(day); const target=8;
  const hrsTxt = hrs>0 ? `<div class="worktotal"><b>${hrs.toFixed(2)}h</b><span>/ ${target}h worked today · trabajadas hoy${hrs>target?` · +${(hrs-target).toFixed(2)}h`:''}</span></div>` : '';
  const off=officeLoc();
  return `<div class="card pad punchcard">
    <div class="sec-title"><span class="dot"></span><span>Punch clock · ${fmtDate(today())}${es('Reloj de fichaje')}</span></div>
    <div class="punchgrid">${cells}</div>
    ${hrsTxt}
    ${off?'':`<div class="warnbox" style="margin-top:12px">${IC.info}<div>Office location isn't set yet — punches save time but can't show on-site distance. Ask your admin.${es('La ubicación de la oficina no está configurada.')}</div></div>`}
  </div>`;
}

/* ---------- Punch view (admin) ---------- */
function punchDaySummary(name,date){
  const day=state.punches.filter(p=>p.name===name && p.work_date===date);
  const get=k=>day.find(x=>x.kind===k);
  const dists=day.filter(p=>p.distance_m!=null).map(p=>p.distance_m);
  const anyOff = dists.some(d=>d>officeRadius());
  const anyNo = day.some(p=>p.lat==null);
  const maxD = dists.length?Math.max(...dists):null;
  return { day, get, hrs:workHours(day), anyOff, anyNo, maxD };
}
function viewPunch(){
  const off=officeLoc();
  const names=canPunchNames();
  // collect name+date pairs
  const pairs=[]; const seen=new Set();
  state.punches.forEach(p=>{ if(!names.includes(p.name)) return; const key=p.name+'|'+p.work_date; if(!seen.has(key)){ seen.add(key); pairs.push({name:p.name, date:p.work_date}); } });
  pairs.sort((a,b)=> b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  const rows=pairs.map(({name,date})=>{
    const s=punchDaySummary(name,date);
    const cell=k=>{ const r=s.get(k); return r?`${fmtT(r.punched_at)}${r.lat!=null?` <a class="maplink" href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank" style="color:var(--early)">📍</a>`:''}`:'<span style="color:var(--faint)">—</span>'; };
    const loc = s.anyNo ? `<span class="locbadge loc-no">Some no-loc</span>` : (s.maxD==null?`<span class="locbadge loc-no">—</span>`:(s.anyOff?`<span class="locbadge loc-off">Off-site ${s.maxD}m</span>`:`<span class="locbadge loc-on">On-site ≤${s.maxD}m</span>`));
    return `<tr>
      <td class="name">${esc(name)}</td><td style="white-space:nowrap">${fmtDate(date)}</td>
      <td>${cell('morning_in')}</td><td>${cell('lunch_out')}</td><td>${cell('lunch_in')}</td><td>${cell('off_out')}</td>
      <td><b>${s.hrs?s.hrs.toFixed(2)+'h':'—'}</b></td><td>${loc}</td>
      <td><button class="act del" style="width:30px;height:30px" title="Delete day" onclick="delPunchDay('${esc(name)}','${date}')">${IC.trash}</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="card pad" style="margin-bottom:16px">
      <div class="sec-title"><span class="dot"></span><span>Office location${es('Ubicación de la oficina')}</span></div>
      <div class="default-allow">
        <div class="field"><label>Latitude${es('Latitud')}</label><input type="number" step="0.000001" value="${esc(state.settings.office_lat||'')}" onchange="setDefault('office_lat',this.value)"></div>
        <div class="field"><label>Longitude${es('Longitud')}</label><input type="number" step="0.000001" value="${esc(state.settings.office_lng||'')}" onchange="setDefault('office_lng',this.value)"></div>
        <div class="field"><label>Radius (m)${es('Radio (m)')}</label><input type="number" min="10" step="10" value="${esc(state.settings.office_radius||'200')}" onchange="setDefault('office_radius',this.value)"></div>
        <button class="submit" onclick="useCurrentOffice()" style="padding:11px 16px">Use current location<span class="b-es">Usar ubicación actual</span></button>
      </div>
      <div style="font-size:12px;color:var(--soft);margin-top:10px;line-height:1.5">${off?`Office set. Punches within ${officeRadius()}m show as On-site.`:'Not set. Open this page at the office and tap "Use current location".'} Phone GPS is accurate to a few meters; laptops can be off by hundreds.<span class="es" style="margin-top:2px">${off?`Configurada. Fichajes dentro de ${officeRadius()}m se marcan On-site.`:'Sin configurar. Abre esta página en la oficina y toca "Usar ubicación actual".'}</span></div>
    </div>
    <div class="list-head"><div><h3>Punch records<span class="es">Registros de fichaje</span></h3><div class="count">${names.length} tracked · ${pairs.length} days</div></div>
      <div class="headbtns">
        <button class="csv" onclick="exportPunchesCSV()">${IC.csv}<span class="txt">CSV (Excel)<span class="b-es">CSV para Excel</span></span></button>
        <button class="export" onclick="exportPunchesXLSX()">${IC.excel}<span class="txt">Excel .xlsx<span class="b-es">Excel .xlsx</span></span></button>
      </div></div>
    <div class="card"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Name</th><th>Date</th><th>Morning In</th><th>Lunch Out</th><th>Lunch In</th><th>Off Out</th><th>Hours</th><th>Location</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" style="text-align:center;color:var(--soft);padding:30px">No punches yet · Sin fichajes</td></tr>`}</tbody>

  `;

function punchExportRows(){
  const names=canPunchNames();
  return state.punches.filter(p=>names.includes(p.name)).slice().sort((a,b)=> new Date(a.punched_at)-new Date(b.punched_at)).map(p=>({
    'Name':p.name,'Date':p.work_date,'Punch':PK[p.kind]?PK[p.kind].en:p.kind,'Time':fmtT(p.punched_at),
    'Latitude':p.lat!=null?p.lat:'','Longitude':p.lng!=null?p.lng:'','Accuracy (m)':p.accuracy!=null?p.accuracy:'',
    'Distance from office (m)':p.distance_m!=null?p.distance_m:'','On-site':p.distance_m!=null?(p.distance_m<=officeRadius()?'Yes':'No'):'',

function exportPunchesCSV(){ const rows=punchExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; } downloadCSV(`Punches_${today()}.csv`, toCSV(rows)); toast('CSV downloaded<span class="b-es">CSV descargado</span>'); }
function exportPunchesXLSX(){
  if(typeof XLSX==='undefined'){ toast('Excel module still loading'); return; }
  const rows=punchExportRows(); if(!rows.length){ toast('Nothing to export · Nada'); return; }
  const wb=XLSX.utils.book_new(); const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:12},{wch:13},{wch:11},{wch:12},{wch:12},{wch:11},{wch:20},{wch:8},{wch:34}];
  XLSX.utils.book_append_sheet(wb,ws,'Punches'); XLSX.writeFile(wb,`Punches_${today()}.xlsx`);
  toast('Excel downloaded<span class="b-es">Excel descargado</span>');
}

function reqRow(r,isAdmin){
  const catB=CAT[r.cat]||CAT.pto, detB=DETAIL[r.detail], st=STATUS[r.status]||STATUS.pending;
  const showDet = detB && detB.label!==catB.label;
  let dateLine, amount;
  if(r.dur==='hourly'){
    dateLine = `${fmtDate(r.start)} · ${fmt12(r.startTime)} → ${fmt12(addHours(r.startTime, r.hours))}`;
    amount = `${r.hours}h (${fmtNum(r.days)} day)`;
  } else if(r.dur==='half'){
    const hh = r.startTime ? ` · ${fmt12(r.startTime)} → ${fmt12(addHours(r.startTime, hpd()/2))}` : '';
    dateLine = `${fmtDate(r.start)} · Half day${hh}`;
    amount = `${fmtNum(r.days)} day`;
  } else {
    dateLine = r.start===r.end?fmtDate(r.start):`${fmtDate(r.start)} → ${fmtDate(r.end)}`;
    amount = `${fmtNum(r.days)} day${(+r.days)===1?'':'s'}`;
  }
  const reviewed = r.reviewedBy ? ` · ${st.en} by ${esc(r.reviewedBy)}` : '';
  const edited = r.editedBy ? ` · edited by ${esc(r.editedBy)}` : '';
  return `<div class="req">
    <div class="badges">
      <span class="badge ${catB.cls}">${catB.label}<span class="es">${catB.es}</span></span>
      ${showDet?`<span class="badge ${detB.cls}">${detB.label}<span class="es">${detB.es}</span></span>`:''}
      <span class="sbadge" style="color:${st.c};background:${st.bg}">${st.en} · ${st.es}</span>
    </div>
    <div class="req-main">
      <div class="req-top"><span class="req-name">${esc(r.name)}</span><span class="req-days">· ${amount}</span></div>
      <div class="req-dates">${dateLine}</div>
      ${r.reason?`<div class="req-reason">${esc(r.reason)}</div>`:''}
      <div class="req-meta">Submitted / Enviado ${fmtDT(r.createdAt)}${r.by?` · ${esc(r.by)}`:''}${reviewed}${edited}</div>
    </div>
    ${isAdmin?`<div class="acts">
      <button class="act ok ${r.status==='approved'?'on':''}" title="Approve · Aprobar" onclick="setStatus('${r.id}','approved')">${IC.check}</button>
      <button class="act no ${r.status==='rejected'?'on':''}" title="Reject · Rechazar" onclick="setStatus('${r.id}','rejected')">${IC.x}</button>
      <button class="act edit" title="Edit · Editar" onclick="openEdit('${r.id}')">${IC.pencil}</button>
      <button class="act del" title="Delete · Eliminar" onclick="delReq('${r.id}')">${IC.trash}</button>
    </div>`:''}
  </div>`;
}

  const ACT={ approve:{en:'Approved',c:'var(--ok)'}, reject:{en:'Rejected',c:'var(--warnc)'}, delete:{en:'Deleted',c:'var(--danger)'}, edit:{en:'Edited',c:'var(--half)'}, allowance:{en:'Allowance',c:'var(--half)'}, setting:{en:'Setting',c:'var(--half)'}, roster:{en:'Roster',c:'var(--early)'}, code:{en:'Login code',c:'var(--early)'}, punchset:{en:'Punch access',c:'var(--early)'}, punchdel:{en:'Punch deleted',c:'var(--danger)'} };
  const rows=(state.audit||[]).map(a=>{ const m=ACT[a.action]||{en:a.action,c:'var(--soft)'};
    return `<tr><td style="white-space:nowrap"><span class="sbadge" style="color:${m.c};background:var(--line-2)">${m.en}</span></td><td>${esc(a.detail||'')}</td><td style="white-space:nowrap">${esc(a.actor||'')}</td><td style="white-space:nowrap;color:var(--soft)">${fmtDT(a.created_at)}</td></tr>`;
  }).join('');
  return `
    <div class="list-head"><div><h3>Audit log<span class="es">Registro de auditoría</span></h3><div class="count">Admin actions · last 200 · últimas 200</div></div></div>
    <div class="card"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Action / Acción</th><th>Detail / Detalle</th><th>Admin</th><th>When / Cuándo</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" style="text-align:center;color:var(--soft);padding:30px">No activity yet · Sin actividad</td></tr>`}</tbody>
    </table></div></div>
    <div class="note">${IC.info}<div>Records admin actions only. Deleted requests keep a summary line here.${es('Registra solo acciones de administradores. Las solicitudes eliminadas dejan un resumen aquí.')}</div></div>
  `;
}

/* ============ boot ============ */
(async function(){
  if(!CONFIGURED){ render(); return; }
  try{ await Promise.all([loadSettings(), loadEmployees()]); }catch(e){ console.error(e); }
  try{ const { data:{ session } } = await db.auth.getSession(); if(session){ state.role='admin'; state.user=session.user.email; return enterDash(); } }catch(e){ console.error(e); }
  const emp=lsGet('pto_emp');
  if(emp && rosterNames().includes(emp)){ state.role='employee'; state.user=emp; return enterDash(); }
  if(emp) lsDel('pto_emp'); // stored name no longer on the roster
  state.screen='login'; render();
})();
</script>
